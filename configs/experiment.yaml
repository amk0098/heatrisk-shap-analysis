# Starter configuration. Verify all assumptions against the source project.
project:
  name: heatrisk-shap-analysis
  source_repository: https://github.com/amk0098/heatrisk-deutschland
  source_version: 9974c0eb22b027d3a9ed66f89a7ecf3925d6b102  # main HEAD, recorded 2026-11-03
  target: heat_day_next

data:
  feature_columns: [TMK, TXK, TNK, VPM, UPM, TXK_lag_1, TXK_rolling_3]
  train_end: '2020-12-31'
  validation_start: '2021-01-01'
  validation_end: '2023-12-31'
  test_start: '2024-01-01'
model:
  framework: pytorch  # required for DeepSHAP (seminar requirement, 05.11.2026)
  random_seed: 42
  hidden_layers: [16, 8]  # 7-16-8-1 = 273 parameters, matches the seminar slides
  activation: relu
explainability:
  outputs: [logit, embedding]  # seminar requirement; 'embedding' meaning to be confirmed with supervisor
  background_source: training_only
  explainers: [deepshap, kernelshap]  # plus exact Shapley (7 features) as a check
  random_seed: 42
