# Record of the settings used for the results in docs/experiment_log.md.
# The scripts define these values as constants (src/data.py, scripts/*.py); keep this file in sync.
project:
  name: heatrisk-shap-analysis
  source_repository: https://github.com/amk0098/heatrisk-deutschland
  source_version: 9974c0eb22b027d3a9ed66f89a7ecf3925d6b102  # main HEAD, recorded 2026-11-03
  target: heat_day_next

data:
  feature_columns: [TMK, TXK, TNK, VPM, UPM, TXK_lag_1, TXK_rolling_3]
  train_end: '2020-12-31'
  validation_start: '2021-01-01'
  validation_end: '2023-12-31'
  test_start: '2024-01-01'
model:
  framework: pytorch  # required for DeepSHAP (seminar requirement, 05.11.2026)
  random_seed: 42
  hidden_layers: [16, 8]  # 7-16-8-1 = 273 parameters, matches the seminar slides
  activation: relu
  loss: bce_with_logits  # pos_weight = n_neg / n_pos on training data (32.0)
  optimizer: adam  # lr 1e-3, batch 256, max 300 epochs, early stopping patience 20
  threshold: best_f1_on_validation  # 0.9
explainability:
  outputs: [logit, embedding]  # embedding: both readings built (features -> neurons, neurons -> logit)
  background_source: training_only
  background_size: 100
  explainers: [exact, kernelshap, deepshap]  # exact = own code, all 2^7 coalitions
  random_seed: 42
