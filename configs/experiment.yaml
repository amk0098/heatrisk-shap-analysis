model:
  framework: to_be_decided
  random_seed: 42
  hidden_layers: [32, 16]
  activation: relu
explainability:
  output: positive_class_probability
  background_source: training_only
  explainer: to_be_selected_after_compatibility_check
  random_seed: 42
